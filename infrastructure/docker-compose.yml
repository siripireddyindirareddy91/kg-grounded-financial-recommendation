services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fingraph
      POSTGRES_USER: fingraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fingraph"]
      interval: 5s
      retries: 10
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://fingraph:${POSTGRES_PASSWORD}@postgres:5432/fingraph
      DEMO_MODE: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
